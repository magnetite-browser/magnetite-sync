name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Sets DATABASE_URL; each test gets a database of its own there.
      - name: Postgres for the tests
        run: tools/test-postgres.sh >>"$GITHUB_ENV"
      - run: cargo test --locked --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
  # The image and the static binary in it, for both architectures (the build
  # writes the third-party notices): started with compose.yml and its
  # Postgres, installed with the Helm chart in kind, then packed as the
  # release would pack it and kept for 14 days, so a pull request can be
  # tried without building it.
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --build-arg REVISION="$GITHUB_SHA" --tag magnetite-sync:ci .
      - name: Start it
        run: tools/smoke-test.sh magnetite-sync:ci
      - name: Install the Helm chart
        run: tools/chart-test.sh magnetite-sync:ci
      - name: Pack the binary
        run: tools/package.sh magnetite-sync:ci "${GITHUB_SHA::12}" ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magnetite-sync-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
