# For a v* tag: container images for amd64 and arm64 and the Helm chart on
# GHCR under the version's tag, and a draft GitHub release with the static
# binaries of both (tar.gz with their licence files) and SHA256SUMS. Publishing the draft (and
# the magnetite-sync-proto crate) is a manual step: docs/release.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        name: Tag matches Cargo.toml and the chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"$" Cargo.toml || { echo "Cargo.toml is not at $version"; exit 1; }
          chart=charts/magnetite-sync/Chart.yaml
          if ! grep -q "^version: $version$" "$chart" || ! grep -q "^appVersion: \"$version\"$" "$chart"; then
            echo "$chart is not at $version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  image:
    name: Image (${{ matrix.arch }})
    needs: check
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/magnetite-sync
      VERSION: ${{ needs.check.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg REVISION="$GITHUB_SHA" --tag "$IMAGE:$VERSION-$ARCH" .
      - name: Start it
        run: tools/smoke-test.sh "$IMAGE:$VERSION-$ARCH"
      - name: Pack the binary
        run: tools/package.sh "$IMAGE:$VERSION-$ARCH" "$VERSION" "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magnetite-sync-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION-$ARCH"

  manifest:
    name: Image (both architectures)
    needs: [check, image]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/magnetite-sync
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: One tag for both architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"

  chart:
    name: Helm chart
    needs: [check, manifest]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          helm package charts/magnetite-sync --destination dist
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/magnetite-sync-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"

  draft:
    name: Draft release
    needs: [check, manifest, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: magnetite-sync-linux-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz >SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "magnetite-sync $VERSION" --generate-notes \
            --notes "Image: \`ghcr.io/${{ github.repository_owner }}/magnetite-sync:$VERSION\` (amd64, arm64). Helm chart: \`oci://ghcr.io/${{ github.repository_owner }}/charts/magnetite-sync\`, version $VERSION. Static Linux binaries below; check them against SHA256SUMS." \
            dist/*.tar.gz dist/SHA256SUMS
