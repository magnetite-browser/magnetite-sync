# Releases the version on main once it has no tag yet (docs/release.md):
# after one approval in the `release` environment, container images for amd64
# and arm64 and the Helm chart on GHCR under the version's tag, then the GitHub
# release v<version> with the static binaries of both (tar.gz with their
# licence files), SHA256SUMS and the version's CHANGELOG.md section.
# Publishing the release creates the tag. Every other push stops after the
# first job.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time; a push during a release waits for it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: New version?
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        name: The version agrees everywhere and has no tag yet
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no version in Cargo.toml's [workspace.package]"
            exit 1
          fi
          chart=charts/magnetite-sync/Chart.yaml
          if ! grep -qx "version: $version" "$chart" || ! grep -qx "appVersion: \"$version\"" "$chart"; then
            echo "::error::$chart is not at $version (Cargo.toml)"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

          found=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null || found=$?
          case $found in
            0)
              echo "v$version is released already."
              echo "release=false" >>"$GITHUB_OUTPUT"
              exit 0
              ;;
            2) ;; # no such tag
            *)
              echo "::error::could not list the tags"
              exit 1
              ;;
          esac
          if ! grep -Eqx "## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section \"## $version (<date>)\""
            exit 1
          fi
          echo "release=true" >>"$GITHUB_OUTPUT"

  approve:
    name: Approve v${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    # Its required reviewers approve the release; nothing is published before.
    environment: release
    steps:
      - run: echo "Approved."

  image:
    name: Image (${{ matrix.arch }})
    needs: [version, approve]
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/magnetite-sync
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --build-arg REVISION="$GITHUB_SHA" --tag "$IMAGE:$VERSION-$ARCH" .
      - name: Start it
        run: tools/smoke-test.sh "$IMAGE:$VERSION-$ARCH"
      - name: Pack the binary
        run: tools/package.sh "$IMAGE:$VERSION-$ARCH" "$VERSION" "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magnetite-sync-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION-$ARCH"

  manifest:
    name: Image (both architectures)
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/magnetite-sync
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: One tag for both architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"

  chart:
    name: Helm chart
    needs: [version, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          helm package charts/magnetite-sync --destination dist
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/magnetite-sync-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"

  release:
    name: GitHub release
    needs: [version, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: magnetite-sync-linux-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz >SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The version's CHANGELOG.md section, without its heading.
          awk -v heading="## $VERSION (" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md >notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::the CHANGELOG.md section for $VERSION is empty"
            exit 1
          fi
          {
            echo
            echo "Image: \`ghcr.io/$OWNER/magnetite-sync:$VERSION\` (amd64, arm64). Helm chart: \`oci://ghcr.io/$OWNER/charts/magnetite-sync\`, version $VERSION. Static Linux binaries below; check them against \`SHA256SUMS\`."
          } >>notes.md
          # Uploads the files before it publishes the release, which then
          # creates the tag on this commit.
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "magnetite-sync $VERSION" --notes-file notes.md \
            dist/*.tar.gz dist/SHA256SUMS
