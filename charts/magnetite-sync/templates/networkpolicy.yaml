{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "magnetite-sync.fullname" . }}
  labels:
    {{- include "magnetite-sync.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "magnetite-sync.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # Name lookups, then the database; the server connects nowhere else.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: {{ .Values.networkPolicy.databasePort }}
          protocol: TCP
      {{- with .Values.networkPolicy.databaseTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
