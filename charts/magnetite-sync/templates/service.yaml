apiVersion: v1
kind: Service
metadata:
  name: {{ include "magnetite-sync.fullname" . }}
  labels:
    {{- include "magnetite-sync.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "magnetite-sync.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
