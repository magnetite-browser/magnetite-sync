{{- $registration := .Values.registration -}}
{{- $database := .Values.database -}}
{{- if not $registration.existingSecret.name -}}
{{- if not (regexMatch "^(open|closed|invite:.{16,})$" (toString $registration.value)) -}}
{{- fail "registration.value must be \"open\", \"closed\" or \"invite:<code>\" with a code of at least 16 characters, or name a Secret in registration.existingSecret.name" -}}
{{- end -}}
{{- end -}}
{{- if not $database.existingSecret.name -}}
{{- if not (regexMatch "^postgres(ql)?://" (toString $database.url)) -}}
{{- fail "database.url must be a postgres:// URL, or name a Secret in database.existingSecret.name" -}}
{{- end -}}
{{- end -}}
{{- if or (not $registration.existingSecret.name) (not $database.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "magnetite-sync.fullname" . }}
  labels:
    {{- include "magnetite-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not $registration.existingSecret.name }}
  registration: {{ $registration.value | quote }}
  {{- end }}
  {{- if not $database.existingSecret.name }}
  url: {{ $database.url | quote }}
  {{- end }}
{{- end }}
